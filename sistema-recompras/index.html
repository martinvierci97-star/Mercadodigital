<style>
/* Layout: barra de rol arriba, contenido en una columna en celular y dos en escritorio; ficha del cliente como panel inferior */
:root {
  --bg: #f2f4f8;
  --surface: #ffffff;
  --surface-2: #e8ecf3;
  --fg: #141a26;
  --muted: #5d6679;
  --line: #d8dee9;
  --accent: #1d2a6b;
  --accent-2: #f39200;
  --accent-fg: #ffffff;
  --accent-soft: #e3e7f6;
  --ok: #187a4a; --ok-soft: #dbf2e5;
  --warn: #a35c00; --warn-soft: #fcecd2;
  --bad: #b42a2a; --bad-soft: #fbe2e2;
  --ai: #7a3fb8; --ai-soft: #efe4fa;
  --display: "Bricolage Grotesque", "Albert Sans", system-ui, sans-serif;
  --body: "Albert Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e121a; --surface: #161c27; --surface-2: #202836; --fg: #e8ecf4; --muted: #9aa4b8; --line: #2b3445;
    --accent: #9fb0ff; --accent-2: #ffb347; --accent-fg: #0b1430; --accent-soft: #1f2a4d;
    --ok: #5ccf92; --ok-soft: #133224; --warn: #f2b65a; --warn-soft: #3a2a10; --bad: #ff8d8d; --bad-soft: #3d1a1a;
    --ai: #c79bf5; --ai-soft: #2c1f3d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e121a; --surface: #161c27; --surface-2: #202836; --fg: #e8ecf4; --muted: #9aa4b8; --line: #2b3445;
  --accent: #9fb0ff; --accent-2: #ffb347; --accent-fg: #0b1430; --accent-soft: #1f2a4d;
  --ok: #5ccf92; --ok-soft: #133224; --warn: #f2b65a; --warn-soft: #3a2a10; --bad: #ff8d8d; --bad-soft: #3d1a1a;
  --ai: #c79bf5; --ai-soft: #2c1f3d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px; }
header.top .wrap { display: grid; gap: 10px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -.2px; }
.brand h1 span { color: var(--accent-2); }
.dataTag { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--surface-2); padding: 4px 10px; border-radius: 999px; }
.roles { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.roles::-webkit-scrollbar { display: none; }
.roles button { flex: none; border: 1.5px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; min-height: 40px; }
.roles button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.roles .lbl { flex: none; align-self: center; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; padding-right: 2px; }

main { padding-block: 18px 60px; }
.view { display: grid; gap: 18px; }
h2.sec { margin: 0; font-family: var(--display); font-weight: 600; font-size: 19px; letter-spacing: -.1px; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.grid2 { display: grid; gap: 18px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .grid2 { grid-template-columns: 1.35fr 1fr; align-items: start; } }
.hdr { display: grid; gap: 6px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 2px; min-width: 0; align-content: start; }
.kpi .k { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.kpi .v { font-family: var(--display); font-weight: 800; font-size: clamp(20px, 2.1vw, 24px); letter-spacing: -.3px; overflow-wrap: anywhere; }
.kpi .d { font-size: 13px; color: var(--muted); }
.kpi .d.down { color: var(--bad); } .kpi .d.up { color: var(--ok); }

.goal { background: var(--accent); color: var(--accent-fg); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.goal .row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: end; }
.goal .big { font-family: var(--display); font-weight: 800; font-size: 26px; }
.goal .mut { opacity: .8; font-size: 13px; }
.goal select { background: var(--surface); color: var(--fg); border: 0; min-height: 44px; border-radius: 10px; padding: 8px 10px; font-weight: 700; max-width: 100%; }
.goal .stats { display: flex; gap: 8px 18px; flex-wrap: wrap; font-size: 13px; }
.goal .stats b { font-size: 15px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; min-height: 36px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

.list { display: grid; gap: 10px; }
.cli { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; text-align: left; width: 100%; }
.cli:hover { border-color: var(--accent); }
.cli.done { opacity: .6; }
.cli .h { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.cli .h > div { min-width: 0; }
.cli .nm { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.cli .why { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.score { flex: none; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1; }
.score small { font-family: var(--body); font-size: 10px; font-weight: 600; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.t-reposicion { background: var(--ok-soft); color: var(--ok); }
.t-complemento { background: var(--accent-soft); color: var(--accent); }
.t-reactivar { background: var(--warn-soft); color: var(--warn); }
.t-afinidad { background: var(--ai-soft); color: var(--ai); }
.t-bad { background: var(--bad-soft); color: var(--bad); }
.cli .sug { display: flex; justify-content: space-between; gap: 6px 10px; flex-wrap: wrap; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; font-size: 14px; }
.cli .sug > span { min-width: 0; overflow-wrap: anywhere; }

.btn { border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 700; font-size: 14px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
.btn-p { background: var(--accent); color: var(--accent-fg); }
.btn-o { background: var(--accent-2); color: #1b1200; }
.btn-g { background: var(--surface-2); color: var(--fg); }
.btn-ok { background: var(--ok); color: #fff; }
.btn-bad { background: var(--bad-soft); color: var(--bad); }
.btn-wa { background: #1f9d55; color: #fff; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

.scroll { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
table.t th, table.t td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
table.t th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; font-weight: 600; }
table.t td.r, table.t th.r { text-align: right; }
table.t td.w { white-space: normal; min-width: 180px; }
table.t tr:last-child td { border-bottom: 0; }

.scrim { position: fixed; inset: 0; background: rgba(8, 12, 20, .45); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 88%; overflow-y: auto;
  background: var(--bg); border-radius: 18px 18px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.25);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(20px + env(safe-area-inset-bottom, 0px));
}
.sheet .in { max-width: 720px; margin: 0 auto; display: grid; gap: 14px; }
.sheet .grab { width: 44px; height: 5px; background: var(--line); border-radius: 999px; margin: 0 auto 4px; }
.sheet .hd { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.sheet .hd > div { min-width: 0; }
.sheet .hd h3 { margin: 0; font-family: var(--display); font-size: 22px; font-weight: 800; overflow-wrap: anywhere; }
.x { border: 0; background: var(--surface-2); width: 40px; height: 40px; border-radius: 999px; font-size: 20px; flex: none; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-width: 0; }
.fact .k { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
.fact .v { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.msg { width: 100%; min-height: 120px; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface); resize: vertical; font-size: 15px; }
.timeline .it { display: grid; grid-template-columns: 84px 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.timeline .it > span { min-width: 0; overflow-wrap: anywhere; }
.timeline .it:last-child { border-bottom: 0; }
.timeline .dd { color: var(--muted); }
.res { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.res button { min-height: 48px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; }
.res button:hover { border-color: var(--accent); }
.inline { display: grid; gap: 6px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .lab { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
input[type=number], input[type=text], select.in { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-size: 15px; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.warnbox { padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); font-size: 14px; }
.warnbox b { color: var(--warn); }
.okbox { padding: 10px 12px; border-radius: 10px; background: var(--ok-soft); font-size: 14px; }
.okbox b { color: var(--ok); }

.offers { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.offer { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: grid; }
.offer .art { aspect-ratio: 16 / 9; max-width: 100%; display: grid; place-items: center; text-align: center; padding: 12px; font-family: var(--display); font-weight: 800; font-size: 20px; color: #fff; line-height: 1.1; }
.offer .art img { width: 100%; height: 100%; object-fit: cover; }
.offer .bd { padding: 12px; display: grid; gap: 6px; }
.upload { position: relative; border: 2px dashed var(--line); border-radius: var(--r); display: grid; place-items: center; text-align: center; padding: 18px; gap: 4px; font-weight: 700; min-height: 140px; cursor: pointer; background: var(--surface); }
.upload small { font-weight: 400; color: var(--muted); }
.upload input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.upload.big { min-height: 200px; font-size: 18px; border-color: var(--accent); }

.ap { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--warn); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; }
.ap.ok { border-left-color: var(--ok); } .ap.no { border-left-color: var(--bad); }
.ap .h { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ap .meta { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 14px; }
.alert { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; }
.alert .dot { width: 10px; height: 10px; border-radius: 999px; margin-top: 5px; }
.empty { text-align: center; color: var(--muted); padding: 20px; border: 1.5px dashed var(--line); border-radius: var(--r); }
svg text { fill: var(--muted); font-family: var(--body); font-size: 11px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 999px; font-weight: 600; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.steps { display: grid; gap: 10px; counter-reset: s; }
.steps li { list-style: none; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.steps li::before { counter-increment: s; content: counter(s); width: 28px; height: 28px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.steps { padding: 0; margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>
[hidden] { display: none !important; }
.tabs2 { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs2::-webkit-scrollbar { display: none; }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.who b { color: var(--fg); }
.feed { display: grid; gap: 0; }
.feed .it { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; align-items: start; }
.feed .it:last-child { border-bottom: 0; }
.feed .it > span { min-width: 0; overflow-wrap: anywhere; }
.feed .t { color: var(--muted); font-size: 12px; white-space: nowrap; }
.bar2 { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; min-width: 60px; }
.bar2 > i { display: block; height: 100%; background: var(--accent-2); border-radius: 999px; }
.center { max-width: 560px; margin: 24px auto; }
.pill-sel { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.pill-sel input { position: absolute; opacity: 0; pointer-events: none; }
.pill-sel label { display: grid; gap: 2px; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; font-weight: 700; }
.pill-sel label small { font-weight: 400; color: var(--muted); font-size: 13px; }
.pill-sel input:checked + label { border-color: var(--accent); background: var(--accent-soft); }
.pill-sel input:focus-visible + label { outline: 3px solid var(--accent-2); outline-offset: 2px; }
</style>

<header class="top gut"><div class="wrap">
  <div class="brand">
    <h1>Recompras <span>Mercado Digital</span></h1>
    <span class="who" id="whoBox"></span>
  </div>
  <div class="roles" role="toolbar" aria-label="Secciones" id="tabs" hidden></div>
</div></header>

<main class="gut"><div class="wrap" id="app">
  <section class="view center"><div class="card"><h2 class="sec">Cargando el sistema…</h2><p class="note">Conectando con la base de datos compartida.</p></div></section>
</div></main>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  // ============================================================
  // Utilidades
  // ============================================================
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const gs = (n) => 'Gs ' + Math.round(n || 0).toLocaleString('es-PY');
  const gsM = (n) => 'Gs ' + ((n || 0) / 1e6).toLocaleString('es-PY', { maximumFractionDigits: 1 }) + ' M';
  const pct = (n) => (isFinite(n) ? (Math.round(n * 1000) / 10).toLocaleString('es-PY') : '0') + '%';
  const DAY = 864e5;
  const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
  const cortar = (s, n = 60) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1).trim() + '…' : s; };
  const fecha = (t) => new Date(t).toLocaleDateString('es-PY', { day: '2-digit', month: '2-digit', year: 'numeric' });
  const hora = (t) => new Date(t).toLocaleString('es-PY', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const mesDe = (t) => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3000); }
  function errTxt(e) {
    const c = e && e.code;
    if (c === 'invalid_argument') return 'No tenés permiso para guardar esto. Pedile al dueño acceso de Contributor o Editor.';
    if (c === 'quota_exceeded') return 'Se llenó el espacio de la base de datos.';
    if (c === 'resource_exhausted') return 'Demasiados cambios seguidos. Esperá unos segundos.';
    return 'No se pudo guardar. Revisá la conexión e intentá de nuevo.';
  }

  // ============================================================
  // Reglas por defecto (supuestos editables por el dueño)
  // ============================================================
  const DEF = {
    reposicion: [
      { nombre: 'Skincare', match: 'skincare', dias: 45, aviso: 7 },
      { nombre: 'Tintas', match: 'tintas', dias: 30, aviso: 5 },
      { nombre: 'Toners', match: 'toners', dias: 60, aviso: 7 },
      { nombre: 'Perfumes', match: 'perfume', dias: 90, aviso: 10 },
      { nombre: 'Belleza y salud', match: 'belleza', dias: 45, aviso: 7 },
    ],
    complementos: [
      { si: 'celulares', ofrecer: ['Cargadores portátiles', 'Auriculares', 'Relojes inteligentes'], desde: 2, hasta: 21 },
      { si: 'notebooks', ofrecer: ['Mouses', 'Monitores', 'Teclados'], desde: 2, hasta: 30 },
      { si: 'televisores', ofrecer: ['Soportes para TV', 'Parlantes'], desde: 1, hasta: 21 },
      { si: 'monitores', ofrecer: ['UPS', 'Soportes para monitores'], desde: 2, hasta: 30 },
      { si: 'impresoras', ofrecer: ['Tintas', 'Toners'], desde: 15, hasta: 45 },
      { si: 'videojuegos', ofrecer: ['Controles', 'Auriculares Gaming'], desde: 2, hasta: 30 },
      { si: 'auriculares gaming', ofrecer: ['Mouses Gaming', 'Teclados'], desde: 3, hasta: 30 },
    ],
    inactivo: 120, fatiga: 7, listaDiaria: 25, ventanaAtribucion: 30,
    metas: {},
  };
  const MOTIVO = {
    reposicion: { t: 'Reposición', c: 't-reposicion', d: 'Producto que se gasta, cerca de terminarse' },
    complemento: { t: 'Complemento', c: 't-complemento', d: 'Compró hace poco algo que necesita accesorio' },
    reactivar: { t: 'Reactivar', c: 't-reactivar', d: 'Compró 2 o más veces y dejó de comprar' },
    afinidad: { t: 'Afinidad', c: 't-afinidad', d: 'Otros clientes con la misma compra sumaron otra categoría' },
  };

  function parseFecha(v) {

  // ============================================================
  // Motor de oportunidades
  // ============================================================
  function procesar() {
    const raw = Object.keys(CHUNKS).sort((a, b) => +a.slice(1) - +b.slice(1)).flatMap((k) => CHUNKS[k]);
    ORD = raw.map((o) => ({ id: o.i, f: o.f, cli: o.c, tel: o.t, vend: o.v, cat: o.k, marca: o.m, total: o.$, mkt: o.x, prods: (o.p || []).map(([q, n, v]) => ({ q, n, v })) }));
    ORD.sort((a, b) => a.f - b.f);
    if (!ORD.length) { CL = []; OPS = []; STATS = null; return; }
    HUMANOS = new Set(ORD.filter((o) => o.vend).map((o) => o.vend));
    const vendNames = new Set([...HUMANOS].map(norm));
    ORD.forEach((o) => { o.auto = !o.vend; o.vendera = o.vend || (o.mkt === 'Mercado Digital' ? 'Web directa' : o.mkt); });

    TOP = {}; for (const [k, m] of Object.entries(pc)) { const b = Object.entries(m).sort((a, c) => c[1].c - a[1].c)[0]; TOP[k] = { prod: b[0], precio: b[1].s / b[1].c }; }

    const by = new Map();

    CL = [];

        dudoso: !tel || tel.length < 9 || /(\d)\1{5,}/.test(tel.slice(3)) || /0000$/.test(tel), mkt: last.mkt });

    OPS = [];

      const lc = norm(c.last.cat); let op = null;
      for (const r of REGLAS.complementos) {

          const cand = r.ofrecer.map(norm).find((x) => !c.cats.has(x) && TOP[x]) || r.ofrecer.map(norm).find((x) => TOP[x]);
          const t = cand ? TOP[cand] : null; const prog = (c.dias - r.desde) / Math.max(1, r.hasta - r.desde);

            why: `Compró ${cortar(c.last.prods[0]?.n || c.last.cat)} hace ${c.dias} días. Le falta ${r.ofrecer[0].toLowerCase()} o similar.` };

        }
      }

        const oc = c.os.filter((o) => norm(o.cat).includes(norm(r.match))); if (!oc.length) continue;
        const lo = oc[oc.length - 1]; const d = Math.floor((HOY - lo.f) / DAY);

          op = { tipo: 'reposicion', prob: 0.22 + 0.15 * cerca + (oc.length > 1 ? 0.12 : 0), prod: p ? p.n : r.nombre, precio: p ? p.pu : lo.total,
            why: `Compró ${cortar(p ? p.n : r.nombre)} hace ${d} días. Dura unos ${r.dias} días${oc.length > 1 ? ' y ya lo recompró ' + (oc.length - 1) + (oc.length > 2 ? ' veces' : ' vez') : ''}.` };

        const rc = REGLAS.complementos.find((r) => lc.includes(norm(r.si)));
        const cc = rc && rc.ofrecer.map(norm).find((x) => !c.cats.has(x) && TOP[x]);
        const esRepo = REGLAS.reposicion.some((r) => lc.includes(norm(r.match))); const lp = c.last.prods[0];
        const t = cc ? TOP[cc] : esRepo && lp ? { prod: lp.n, precio: lp.pu } : TOP[lc];

    STATS = { tot, n: ORD.length, desde: ORD[0].f, hasta: ORD[ORD.length - 1].f, b2c: b2c.length, rec: rec.length, tasaRec: rec.length / Math.max(1, b2c.length),
      meses, recP, totP, porMkt, sinVend: ORD.filter((o) => o.auto).length, topCli: [...CL].sort((a, b) => b.total - a.total),
      internos: CL.filter((c) => c.interno), dudosos: CL.filter((c) => c.dudoso), confirmado, confPorVend, confPorOferta,
      conIds: ORD.every((o) => o.id), conVar: ORD.some((o) => o.prods.some((p) => p.v)) };
  }

  // Resumen de la actividad registrada por los vendedores
  function actividad(filtroVend, desde) {

    for (const [tel, r] of Object.entries(CONT)) (r.hist || []).forEach((h) => { if ((!filtroVend || h.vend === filtroVend) && (!desde || h.t >= desde)) ev.push({ ...h, tel, cli: r.cli }); });

  }
  const inicioMes = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); };

  // ============================================================
  // Rol del usuario actual
  // ============================================================
  function miAcceso() {

  }
  function rolActivo() { const a = miAcceso(); if (!a) return null; return a.rol === 'duenio' && verComo ? verComo : a.rol; }

  // ============================================================

  function schedule() {

  const V = {}, W = {};

  function recompraPorCat() {

  // ---------- Tablero del dueño ----------
  function chart() {
    const ks = Object.keys(STATS.meses).sort(); const vals = ks.map((k) => STATS.meses[k]);
    const W2 = 640, H = 230, pl = 52, pr = 10, pt = 16, pb = 30;
    const maxV = Math.max(...vals.map((v) => v.total)); const step = maxV > 400e6 ? 100e6 : maxV > 200e6 ? 50e6 : 25e6; const max = Math.ceil(maxV / step) * step;
    const bw = (W2 - pl - pr) / ks.length; const y = (v) => pt + (H - pt - pb) * (1 - v / max);
    const ticks = []; for (let t = 0; t <= max; t += step) ticks.push(t);
    const mes = (k) => ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'][+k.slice(5) - 1];
    return `<svg viewBox="0 0 ${W2} ${H}" width="100%" role="img" aria-label="Facturación por mes">${ticks.map((t) => `<line x1="${pl}" x2="${W2 - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end">${t / 1e6}M</text>`).join('')}
      ${vals.map((v, i) => { const x = pl + i * bw + bw * 0.18, w = bw * 0.64; return `<rect x="${x}" y="${y(v.total)}" width="${w}" height="${y(0) - y(v.total)}" rx="3" fill="var(--accent-soft)"/><rect x="${x}" y="${y(v.rec)}" width="${w}" height="${y(0) - y(v.rec)}" rx="3" fill="var(--accent-2)"/><text x="${pl + i * bw + bw / 2}" y="${H - 10}" text-anchor="middle">${mes(ks[i])}</text>`; }).join('')}</svg>
      <div class="tags"><span class="tag" style="background:var(--accent-soft);color:var(--accent)">Total facturado</span><span class="tag" style="background:var(--accent-2);color:#1b1200">De clientes que ya habían comprado</span></div>`;
  }

        <div class="kpi"><span class="k">Variante</span><span class="v">${S.conVar ? 'Sí' : 'No'}</span><span class="d">${S.conVar ? 'Lista para cruzar con la API de productos.' : 'Falta para traer el margen.'}</span></div>
        <div class="kpi"><span class="k">Precio exacto</span><span class="v">${pct(ORD.filter((o) => o.prods.length === 1).length / S.n)}</span><span class="d">pedidos con un solo producto; el resto se estima</span></div>
        <div class="kpi"><span class="k">Excluidos</span><span class="v">${S.internos.length + S.dudosos.length}</span><span class="d">${S.internos.length} internos, ${S.dudosos.length} teléfonos dudosos</span></div>
      </div>
      <div class="card"><h2 class="sec">Pedidos por canal</h2><div class="scroll"><table class="t num"><thead><tr><th>Canal</th><th class="r">Pedidos</th><th class="r">%</th></tr></thead><tbody>${Object.entries(S.porMkt).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="r">${v}</td><td class="r">${pct(v / S.n)}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
    </section>`;
  };
  W.datos = () => {
    $('fileOrd').onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return; const msg = $('upMsg'); msg.hidden = false; msg.style.color = ''; msg.textContent = 'Leyendo ' + f.name + '…';
      try {
        if (typeof XLSX === 'undefined') throw new Error('No cargó el lector de Excel. Recargá la página.');
        const buf = await f.arrayBuffer();
        const wb = /\.csv$/i.test(f.name) ? XLSX.read(new TextDecoder('utf-8').decode(buf), { type: 'string' }) : XLSX.read(buf, { type: 'array' });
        const { pedidos, anulados } = leerExcel(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: null }));
        if (!pedidos.length) throw new Error('No encontré pedidos con fecha válida.');
        const prev = Object.keys(CHUNKS).sort((a, b) => +a.slice(1) - +b.slice(1)).flatMap((k) => CHUNKS[k]);
        let lista, resumen;
        if (prev.length && pedidos.every((o) => o.i) && prev.every((o) => o.i)) {
          const m = new Map(prev.map((o) => [o.i, o])); let alta = 0;
          pedidos.forEach((o) => { if (!m.has(o.i)) alta++; m.set(o.i, o); }); anulados.forEach((id) => id && m.delete(id));
          lista = [...m.values()]; resumen = `${alta} pedidos nuevos, ${pedidos.length - alta} actualizados`;
        } else { lista = pedidos; resumen = `${pedidos.length} pedidos cargados`; }
        if (anulados.length) resumen += `, ${anulados.length} cancelados o devueltos fuera`;
        lista.sort((a, b) => a.f - b.f);
        msg.textContent = 'Guardando para todo el equipo…';
        const N = 500; const n = Math.ceil(lista.length / N);
        for (let i = 0; i < n; i++) await db.doc('pedidos/c' + i).set({ items: lista.slice(i * N, (i + 1) * N), n: lista.length, t: Date.now() });
        for (const k of Object.keys(CHUNKS)) if (+k.slice(1) >= n) await db.doc('pedidos/' + k).delete();
        upMsg = { ok: true, txt: 'Listo: ' + resumen + '. Total: ' + lista.length.toLocaleString('es-PY') + ' pedidos.' };
        msg.style.color = 'var(--ok)'; msg.textContent = upMsg.txt; toast(upMsg.txt);
      } catch (ex) { upMsg = { ok: false, txt: ex && ex.code ? errTxt(ex) : ex.message || String(ex) }; msg.style.color = 'var(--bad)'; msg.textContent = upMsg.txt; }
    };
  };

  // ---------- Accesos ----------
  V.accesos = () => {
    const pend = SOLIC.filter((s) => !ACCESOS[s.id]);
    const act = Object.entries(ACCESOS);
    const sel = (id, rol, vend) => `<select class="in" data-rol="${esc(id)}" aria-label="Rol">${['vendedor', 'supervisor', 'marketing', 'duenio'].map((r) => `<option value="${r}" ${rol === r ? 'selected' : ''}>${ROLES[r].t}</option>`).join('')}</select>
      <select class="in" data-vend="${esc(id)}" aria-label="Vendedor"><option value="">— no es vendedor —</option>${[...HUMANOS].sort().map((h) => `<option ${vend === h ? 'selected' : ''}>${esc(h)}</option>`).join('')}</select>`;
    return `<section class="view">
      <div class="hdr"><h2 class="sec">Accesos del equipo</h2><p class="sub">Compartí el link con tu equipo desde el botón Share, con permiso Contributor. Cada persona elige su rol y vos la aprobás acá.</p></div>
      <div class="card"><h2 class="sec">Pedidos de acceso · ${pend.length}</h2>
        ${pend.map((s) => `<div class="inline"><b>${esc(NOMBRES[s.id] || 'Persona sin nombre visible')}</b><span class="note">Pide entrar como ${esc(ROLES[s.rol]?.t)}${s.vendedor ? ' (' + esc(s.vendedor) + ')' : ''} · ${hora(s.t)}</span><div class="row2">${sel(s.id, s.rol, s.vendedor)}</div><div class="btns"><button type="button" class="btn btn-ok" data-aprob="${esc(s.id)}">Aprobar</button><button type="button" class="btn btn-bad" data-rech="${esc(s.id)}">Rechazar</button></div></div>`).join('') || '<p class="note">No hay pedidos pendientes.</p>'}
      </div>
      <div class="card"><h2 class="sec">Con acceso · ${act.length}</h2>
        ${act.map(([id, a]) => `<div class="inline"><b>${esc(NOMBRES[id] || 'Persona sin nombre visible')}${id === ME ? ' (vos)' : ''}</b><div class="row2">${sel(id, a.rol, a.vendedor)}</div><div class="btns"><button type="button" class="btn btn-g" data-guardar="${esc(id)}">Guardar cambios</button>${id === ME ? '' : `<button type="button" class="btn btn-bad" data-quitar="${esc(id)}">Quitar acceso</button>`}</div></div>`).join('') || '<p class="note">Solo vos, como dueño.</p>'}
      </div></section>`;
  };
  W.accesos = () => {
    const leer = (id) => ({ rol: document.querySelector(`[data-rol="${CSS.escape(id)}"]`).value, vendedor: document.querySelector(`[data-vend="${CSS.escape(id)}"]`).value });
    const guardar = async (n, m) => { try { await db.doc('config/accesos').set(n); toast(m); } catch (e) { toast(errTxt(e)); } };
    document.querySelectorAll('[data-aprob]').forEach((b) => b.onclick = () => { const a = leer(b.dataset.aprob); if (a.rol === 'vendedor' && !a.vendedor) { toast('Elegí qué vendedor es'); return; } guardar({ ...ACCESOS, [b.dataset.aprob]: a }, 'Acceso aprobado'); });
    document.querySelectorAll('[data-guardar]').forEach((b) => b.onclick = () => guardar({ ...ACCESOS, [b.dataset.guardar]: leer(b.dataset.guardar) }, 'Cambios guardados'));
    document.querySelectorAll('[data-quitar]').forEach((b) => b.onclick = () => { const n = { ...ACCESOS }; delete n[b.dataset.quitar]; guardar(n, 'Acceso quitado'); });
    document.querySelectorAll('[data-rech]').forEach((b) => b.onclick = async () => { try { await db.doc('equipo/' + b.dataset.rech).delete(); toast('Pedido rechazado'); } catch (e) { toast(errTxt(e)); } });
  };

  // ============================================================
  // Conexión a la base de datos
  // ============================================================
  async function nombres(ids) {
    if (!user || !ids.length) return;
    try { const ps = await user.profiles(ids); for (const id of ids) if (ps[id]) NOMBRES[id] = ps[id].name || ''; } catch (e) {}
  }
  async function boot() {
    const C = window.claude;
    if (!C || !C.use) { render(); return; }
    [db, user, assets] = await Promise.all([C.use('db'), C.use('user'), C.use('assets')]);
    if (!db) { render(); return; }
    ME = user ? await user.id() : null; OWNER = user ? await user.isOwner() : false;
    if (ME) await nombres([ME]);
    let re = false; const recalc = () => { re = true; schedule(); };
    const _render = render;
    // Recalcular el motor solo cuando cambian datos que lo afectan
    render = function () { if (re) { re = false; procesar(); } _render(); };
    const on = (q, fn) => q.onSnapshot(fn, () => {});
    on(db.collection('pedidos'), (s) => { CHUNKS = {}; s.docs.forEach((d) => { CHUNKS[d.id] = d.data().items || []; }); recalc(); });
    on(db.doc('config/reglas'), (d) => { REGLAS = d.exists ? { ...JSON.parse(JSON.stringify(DEF)), ...d.data(), metas: d.data().metas || {} } : JSON.parse(JSON.stringify(DEF)); recalc(); });
    on(db.doc('asignacion/canales'), (d) => { ASIG = d.exists ? { ...d.data() } : {}; recalc(); });
    on(db.collection('contactos'), (s) => { CONT = {}; s.docs.forEach((d) => { CONT[d.id] = { ...d.data() }; }); recalc(); });
    on(db.doc('config/accesos'), (d) => { ACCESOS = d.exists ? { ...d.data() } : {}; nombres(Object.keys(ACCESOS)).then(schedule); schedule(); });
    on(db.collection('equipo'), (s) => { SOLIC = s.docs.map((d) => ({ id: d.id, ...d.data() })); nombres(SOLIC.map((x) => x.id)).then(schedule); schedule(); });
    on(db.collection('descuentos'), (s) => { DESC = s.docs.map((d) => ({ id: d.id, ...d.data() })); schedule(); });
    on(db.collection('ofertas'), (s) => { OFER = s.docs.map((d) => ({ id: d.id, ...d.data() })); schedule(); });
    schedule();
  }
  boot();
})();
</script>
