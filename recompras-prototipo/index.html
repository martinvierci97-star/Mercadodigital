* { box-sizing: border-box; }

.wrap { max-width: 1120px; margin: 0 auto; }

header.top .wrap { display: grid; gap: 10px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -.2px; }
.brand h1 span { color: var(--accent); }
.proto { font-size: 12px; font-weight: 700; color: var(--warn); background: var(--warn-soft); padding: 4px 10px; border-radius: 999px; }
.roles { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.roles::-webkit-scrollbar { display: none; }
.roles button { flex: none; border: 1.5px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; min-height: 40px; }

.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 2px; min-width: 0; }

.goal .row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }

.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

.t-complemento { background: var(--accent-soft); color: var(--accent); }
.t-reactivar { background: var(--warn-soft); color: var(--warn); }

.t-bad { background: var(--bad-soft); color: var(--bad); }

.ap .meta { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 14px; }

.alert { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; }
.alert .dot { width: 10px; height: 10px; border-radius: 999px; margin-top: 5px; }
.empty { text-align: center; color: var(--muted); padding: 20px; border: 1.5px dashed var(--line); border-radius: var(--r); }

svg text { fill: var(--muted); font-family: var(--body); font-size: 11px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 999px; font-weight: 600; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

        <div class="alert"><span class="dot" style="background:var(--bad)"></span><div><b>Carla Díaz:</b> 64 oportunidades vencidas y descuento promedio de 11,2%, el doble que el resto. Vende menos y regala más margen. Revisá con ella su lista diaria.</div></div>
        <div class="alert"><span class="dot" style="background:var(--warn)"></span><div><b>Paula Herrera:</b> hizo 9 de 24 contactos hoy. Si sigue así, queda al 34% de la meta.</div></div>
        <div class="alert"><span class="dot" style="background:var(--ok)"></span><div><b>Martín López:</b> mejor conversión del equipo (22,9%). Sus mensajes de complemento de celulares sirven de ejemplo para el resto.</div></div>
      </div>
    </section>`;
  }

  // ===================== MARKETING =====================
  function contarSeg() {
    return poblacion.filter((p) => (seg.cat === 'todas' || p.cat === seg.cat) && p.dias >= seg.diasMin && p.dias <= seg.diasMax && p.ticket >= seg.ticketMin
      && p.edad >= seg.edadMin && p.edad <= seg.edadMax && (seg.genero === 'todos' || p.genero === seg.genero) && p.compras >= seg.comprasMin);
  }
  function vMarketing() {
    const r = contarSeg();
    const tk = r.length ? r.reduce((s, p) => s + p.ticket, 0) / r.length : 0;
    const totIng = ofertas.reduce((s, o) => s + (o.ingresos || 0), 0), totDesc = ofertas.reduce((s, o) => s + (o.costoDesc || 0), 0);
    return `<section class="view">
      <div style="display:grid;gap:6px"><h2 class="sec">Biblioteca de ofertas</h2><p class="sub">Lo que subas acá lo ven los vendedores en su lista y en la ficha de cada cliente.</p></div>
      <div class="offers">
        ${ofertas.map((o) => `<div class="offer"><div class="art" style="background:${o.img ? 'var(--surface-2)' : o.color}">${o.img ? `<img src="${o.img}" alt="${esc(o.titulo)}">` : esc(o.titulo)}</div>
          <div class="bd"><b>${esc(o.titulo)}</b><span class="note">${esc(o.desc)}</span><div class="tags"><span class="tag">${esc(o.cat)}</span><span class="tag t-complemento">-${o.descPct}%</span><span class="tag">vence ${esc(o.vence)}</span></div></div></div>`).join('')}
        <label class="upload" for="upFile">Subir material nuevo<small>Imagen o PDF de la oferta</small><input type="file" id="upFile" accept="image/*,.pdf"></label>
      </div>

      <div class="grid2">
        <div class="card">
          <h2 class="sec">Armar un segmento</h2>
          <p class="note">Probalo: cambiá los filtros y el conteo se recalcula sobre 18.000 clientes de ejemplo.</p>
          <div class="row2">
            <div class="field"><label for="sCat">Compró en</label><select id="sCat">${['todas', ...CATS].map((c) => `<option value="${c}" ${seg.cat === c ? 'selected' : ''}>${c === 'todas' ? 'Todas las categorías' : c}</option>`).join('')}</select></div>
            <div class="field"><label for="sGen">Género</label><select id="sGen"><option value="todos">Todos</option><option value="F" ${seg.genero === 'F' ? 'selected' : ''}>Mujeres</option><option value="M" ${seg.genero === 'M' ? 'selected' : ''}>Hombres</option></select></div>
          </div>
          <div class="row2">
            <div class="field"><label for="sDmin">Días sin comprar, desde</label><input type="number" id="sDmin" value="${seg.diasMin}" min="0"></div>
            <div class="field"><label for="sDmax">hasta</label><input type="number" id="sDmax" value="${seg.diasMax}" min="0"></div>
          </div>
          <div class="row2">
            <div class="field"><label for="sEmin">Edad desde</label><input type="number" id="sEmin" value="${seg.edadMin}"></div>
            <div class="field"><label for="sEmax">hasta</label><input type="number" id="sEmax" value="${seg.edadMax}"></div>
          </div>
          <div class="row2">
            <div class="field"><label for="sTk">Ticket promedio mínimo ($)</label><input type="number" id="sTk" value="${seg.ticketMin}" step="1000"></div>
            <div class="field"><label for="sCm">Compras mínimas</label><input type="number" id="sCm" value="${seg.comprasMin}" min="1"></div>
          </div>
          <div class="okbox num" id="segOut"><b>${r.length.toLocaleString('es-AR')} clientes</b> en el segmento · ticket promedio ${$$(tk)}</div>
          <button type="button" class="btn btn-p" id="segSave">Guardar segmento</button>
        </div>
        <div class="card">
          <h2 class="sec">Resultados por oferta</h2>
          <p class="note">La oferta vale si la ganancia que deja es mayor que lo que regala en descuento.</p>
          <div class="scroll"><table class="t num">
            <thead><tr><th>Oferta</th><th class="r">Ventas</th><th class="r">Ingresos</th><th class="r">Descuento</th><th class="r">Ganancia neta</th><th class="r">Retorno</th></tr></thead>
            <tbody>${ofertas.filter((o) => o.ventas != null).map((o) => `<tr><td>${esc(o.titulo)}</td><td class="r">${o.ventas}</td><td class="r">${$$(o.ingresos)}</td><td class="r">${$$(o.costoDesc)}</td><td class="r"><b>${$$(o.margenNeto)}</b></td><td class="r">${(o.margenNeto / o.costoDesc).toFixed(1).replace('.', ',')}x</td></tr>`).join('')}</tbody>
          </table></div>
          <div class="warnbox num"><b>Para revisar:</b> el 2x1 en sérums regala ${pct(OFERTAS[0].costoDesc / OFERTAS[0].ingresos)} de lo que vende. Es la que menos ganancia deja por cada peso de descuento.</div>
          <p class="note num">Total del mes: ${$$(totIng)} vendidos con ofertas y ${$$(totDesc)} regalados en descuentos.</p>
        </div>
      </div>
    </section>`;
  }
  wire.marketing = (app) => {
    const map = { sCat: 'cat', sGen: 'genero', sDmin: 'diasMin', sDmax: 'diasMax', sEmin: 'edadMin', sEmax: 'edadMax', sTk: 'ticketMin', sCm: 'comprasMin' };
    Object.entries(map).forEach(([id, k]) => $(id).addEventListener('input', () => {
      const v = $(id).value; seg[k] = ['cat', 'genero'].includes(k) ? v : Number(v) || 0;
      const r = contarSeg(); const tk = r.length ? r.reduce((s, p) => s + p.ticket, 0) / r.length : 0;
      $('segOut').innerHTML = `<b>${r.length.toLocaleString('es-AR')} clientes</b> en el segmento · ticket promedio ${$$(tk)}`;
    }));
    $('segSave').onclick = () => toast('Segmento guardado (en el prototipo no se guarda de verdad)');
    $('upFile').addEventListener('change', (e) => {
      const f = e.target.files[0]; if (!f) return;
      const add = (img) => { ofertas.unshift({ id: 'u' + Date.now(), titulo: f.name.replace(/\.[^.]+$/, ''), cat: 'Nueva', desc: 'Material subido recién. Completá la descripción y la vigencia.', descPct: 0, vence: '—', color: 'linear-gradient(135deg,#444c5e,#7a8399)', img }); render(); toast('Material subido. Ya lo ven los vendedores'); };
      if (f.type.startsWith('image/')) { const rd = new FileReader(); rd.onload = () => add(rd.result); rd.readAsDataURL(f); } else add(null);
    });
  };

  // ===================== DUEÑO =====================
  function chart() {
    const W = 640, H = 220, pl = 46, pr = 10, pt = 14, pb = 28;
    const max = 5e6, bw = (W - pl - pr) / semanas.length;
    const y = (v) => pt + (H - pt - pb) * (1 - v / max);
    const ticks = [0, 1e6, 2e6, 3e6, 4e6, 5e6];
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ingresos por recompra, últimas 12 semanas">
      ${ticks.map((t) => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end">${t / 1e6}M</text>`).join('')}
      ${semanas.map((v, i) => `<rect x="${pl + i * bw + bw * 0.18}" y="${y(v)}" width="${bw * 0.64}" height="${y(0) - y(v)}" rx="4" fill="${i === semanas.length - 1 ? 'var(--accent)' : 'var(--accent-soft)'}"/>
        <text x="${pl + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle">S${i + 1}</text>`).join('')}
      <text x="${pl + 11 * bw + bw / 2}" y="${y(semanas[11]) - 6}" text-anchor="middle" style="fill:var(--fg);font-weight:700">${(semanas[11] / 1e6).toFixed(1).replace('.', ',')}M</text>
    </svg>`;
  }
  function vDuenio() {
    const pend = aprobaciones.filter((a) => a.estado === 'pendiente');
    const eq = datosEquipo();
    const ing = eq.reduce((s, v) => s + v.ing, 0);
    return `<section class="view">
      <div style="display:grid;gap:6px"><h2 class="sec">Tablero del dueño</h2><p class="sub">Cuánta plata genera la recompra, cuánto margen se regala y qué está en riesgo.</p></div>
      <div class="kpis num">
        <div class="kpi"><span class="k">Ingresos por recompra (mes)</span><span class="v">${$$(ing)}</span><span class="d up">+18% vs. septiembre</span></div>
        <div class="kpi"><span class="k">Ganancia bruta de recompras</span><span class="v">${$$(ing * 0.41)}</span><span class="d">margen 41% después de descuentos</span></div>
        <div class="kpi"><span class="k">Tasa de recompra 90 días</span><span class="v">27,4%</span><span class="d up">+3,1 puntos en 3 meses</span></div>
        <div class="kpi"><span class="k">Descuento sobre ventas</span><span class="v">6,8%</span><span class="d down">subió desde 5,2%</span></div>
        <div class="kpi"><span class="k">Clientes en riesgo</span><span class="v">2.140</span><span class="d down">frecuentes con más de 150 días sin comprar</span></div>
        <div class="kpi"><span class="k">Valor en riesgo (12 meses)</span><span class="v">${$$(2140 * 35400 * 2.4)}</span><span class="d">si no vuelven a comprar</span></div>
      </div>
      <div class="grid2">
        <div class="card">
          <h2 class="sec">Ingresos por recompra, últimas 12 semanas</h2>
          <div class="scroll" style="min-width:0">${chart()}</div>
          <p class="note">Valores de ejemplo. En el sistema real salen de los pedidos que se suben cada día.</p>
        </div>
        <div class="card">
          <h2 class="sec">Descuentos para aprobar · ${pend.length}</h2>
          <div class="appr">${aprobaciones.map(cardAp).join('') || '<div class="empty">No hay pedidos.</div>'}</div>
        </div>
      </div>
      <div class="card">
        <h2 class="sec">Lo que el sistema te avisa</h2>
        <div class="alert"><span class="dot" style="background:var(--bad)"></span><div><b>El descuento crece más rápido que las ventas.</b> Las recompras subieron 18% y el descuento promedio pasó de 5,2% a 6,8%. Una parte del crecimiento la estás pagando con margen.</div></div>
        <div class="alert"><span class="dot" style="background:var(--warn)"></span><div><b>Suplementos tiene el margen más bajo (34%).</b> Es la categoría que más recompra, así que conviene empujar combos con creatina o colágeno, que dejan más margen.</div></div>
        <div class="alert"><span class="dot" style="background:var(--ok)"></span><div><b>Los complementos de celulares rinden.</b> 62% de margen y 43% de conversión en los primeros 10 días después de la compra.</div></div>
      </div>
    </section>`;
  }
  function cardAp(a) {
    const gan = a.precio * a.margen, ganD = a.precio * (a.margen - a.pct / 100);
    const cls = a.estado === 'aprobado' ? 'ok' : a.estado === 'rechazado' ? 'no' : '';
    return `<div class="ap ${cls}">
      <div class="h"><b>${esc(a.vend)} → ${esc(a.cli)}</b><span class="tag ${a.estado === 'pendiente' ? 't-reactivar' : a.estado === 'aprobado' ? 't-reposicion' : 't-bad'}">${a.estado === 'pendiente' ? 'Pendiente' : a.estado === 'aprobado' ? 'Aprobado' : 'Rechazado'}</span></div>
      <div class="meta num"><span>${esc(a.prod)} · ${$$(a.precio)}</span><span>Pide <b>${a.pct}%</b></span><span>Ganancia: ${$$(gan)} → <b style="color:${ganD < gan * 0.5 ? 'var(--bad)' : 'inherit'}">${$$(ganD)}</b></span></div>
      <div class="note">“${esc(a.motivo)}”</div>
      ${a.estado === 'pendiente' ? `<div class="btns"><button type="button" class="btn btn-ok" data-ap="${a.id}" data-v="aprobado">Aprobar</button><button type="button" class="btn btn-bad" data-ap="${a.id}" data-v="rechazado">Rechazar</button></div>` : ''}
    </div>`;
  }
  wire.duenio = (app) => {
    app.querySelectorAll('[data-ap]').forEach((b) => b.onclick = () => {
      const a = aprobaciones.find((x) => x.id === b.dataset.ap); a.estado = b.dataset.v;
      if (a.ref) { const c = clientes.find((x) => x.id === a.ref); if (c && c.desc) c.desc.estado = a.estado; }
      render(); toast(a.estado === 'aprobado' ? 'Aprobado. El vendedor ya lo ve' : 'Rechazado. El vendedor ya lo ve');
    });
  };

  // ===================== REGLAS =====================
  function vReglas() {
    return `<section class="view">
      <div style="display:grid;gap:6px"><h2 class="sec">Reglas del motor</h2><p class="sub">Así decide el sistema a quién contactar cada día. Las edita el dueño o Marketing.</p></div>
      <div class="grid2">
        <div class="card">
          <h2 class="sec">Reposición: cuánto dura cada producto</h2>
          <div class="scroll"><table class="t">
            <thead><tr><th>Categoría</th><th>Dura (días)</th><th>Avisar antes (días)</th><th>Incluye</th></tr></thead>
            <tbody>${REGLAS.ciclos.map((r, i) => `<tr><td><b>${esc(r.cat)}</b></td><td><input type="number" data-ciclo="${i}" data-k="dias" value="${r.dias}" style="max-width:90px" aria-label="Días de duración ${esc(r.cat)}"></td><td><input type="number" data-ciclo="${i}" data-k="aviso" value="${r.aviso}" style="max-width:90px" aria-label="Días de aviso ${esc(r.cat)}"></td><td class="note">${esc(r.nota)}</td></tr>`).join('')}</tbody>
          </table></div>
          <p class="note">Cuando el sistema tenga suficiente historial, usa la frecuencia real de cada cliente en lugar del promedio de la categoría.</p>
        </div>
        <div class="card">
          <h2 class="sec">Complementos: compró A, ofrecer B</h2>
          <div class="list">${REGLAS.complementos.map((r) => `<div class="inline"><b>Si compró ${esc(r.si)}</b><span>Ofrecer: ${esc(r.ofrecer)}</span><span class="note">Contactar entre el día ${r.desde} y el día ${r.hasta} después de la compra</span></div>`).join('')}</div>
        </div>
      </div>
      <div class="grid2">
        <div class="card">
          <h2 class="sec">Reactivación y cuidado del cliente</h2>
          <div class="field"><label for="rInact">Considerar inactivo después de (días)</label><input type="number" id="rInact" value="${REGLAS.inactivo}"></div>
          <div class="field"><label for="rFat">No volver a contactar antes de (días)</label><input type="number" id="rFat" value="${REGLAS.fatiga}"></div>
          <div class="field"><label for="rDesc">Descuento que el vendedor puede dar sin aprobación</label><input type="number" id="rDesc" value="${REGLAS.topeDescVendedor}" disabled><span class="note">0%: solo ofertas de Marketing. Cualquier otro descuento lo aprueba el dueño.</span></div>
        </div>
        <div class="card">
          <h2 class="sec">Predicción con IA <span class="tag t-ia">Etapa 2</span></h2>
          <p class="note">Con 3 a 6 meses de pedidos, el sistema aprende qué compran los clientes parecidos y sugiere el próximo producto.</p>
          <div class="list">
            <div class="inline"><b>Usa</b><span class="note">Historial de compras, frecuencia, ticket promedio, categorías, edad, género, época del año y respuesta a ofertas anteriores.</span></div>
            <div class="inline"><b>Da</b><span class="note">Producto sugerido, chance de compra y ganancia esperada por cliente. Así la lista prioriza lo que deja más plata, no lo que más factura.</span></div>
            <div class="inline"><b>Se controla</b><span class="note">Cada mes se compara contra un grupo de clientes que no recibió la sugerencia, para medir cuánto vende de más de verdad.</span></div>
          </div>
        </div>
      </div>
    </section>`;
  }
  wire.reglas = (app) => {
    app.querySelectorAll('[data-ciclo]').forEach((inp) => inp.addEventListener('change', () => { REGLAS.ciclos[+inp.dataset.ciclo][inp.dataset.k] = Number(inp.value) || 0; toast('Regla actualizada'); }));
    $('rInact').addEventListener('change', (e) => { REGLAS.inactivo = Number(e.target.value) || 0; toast('Regla actualizada'); });
    $('rFat').addEventListener('change', (e) => { REGLAS.fatiga = Number(e.target.value) || 0; toast('Regla actualizada'); });
  };

  render();
})();
</script>
