<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Sistema de Ventas{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body { background: #f4f6f9; }
    .navbar-brand { font-weight: 700; letter-spacing: .5px; }
    .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,.08); border-radius: 12px; }
    .card-header { border-radius: 12px 12px 0 0 !important; }
    .badge-estado-cerrado  { background: #198754; }
    .badge-estado-proceso  { background: #0d6efd; }
    .badge-estado-caida    { background: #dc3545; }
    .stat-card { border-left: 4px solid; }
    .stat-ventas  { border-color: #198754; }
    .stat-proceso { border-color: #0d6efd; }
    .stat-caida   { border-color: #dc3545; }
    .stat-total   { border-color: #6c757d; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="/"><i class="bi bi-whatsapp me-2"></i>Sistema de Ventas</a>
      <div class="d-flex gap-2">
        <a href="/" class="btn btn-outline-light btn-sm"><i class="bi bi-plus-circle me-1"></i>Nuevo registro</a>
        <a href="/resumen" class="btn btn-light btn-sm text-primary fw-semibold"><i class="bi bi-bar-chart-fill me-1"></i>Resumen del día</a>
        <a href="/productos/importar" class="btn btn-outline-light btn-sm"><i class="bi bi-file-earmark-spreadsheet me-1"></i>Importar Excel</a>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
