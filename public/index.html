<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Ventas WhatsApp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <span class="logo">💬</span>
  <h1>Registro de Ventas</h1>
  <nav>
    <a href="admin.html">Panel Admin</a>
  </nav>
</header>

<main>
  <div class="card">
    <h2>👤 Datos del vendedor</h2>
    <div class="form-group">
      <label for="seller-name">Tu nombre *</label>
      <input type="text" id="seller-name" placeholder="Ej: María González" autocomplete="name">
    </div>
  </div>

  <div class="card">
    <h2>📋 Nuevo registro</h2>

    <div id="alert-box" class="alert hidden"></div>

    <form id="sale-form" novalidate>

      <div class="form-group">
        <label for="date">Fecha *</label>
        <input type="date" id="date" required>
      </div>

      <div class="form-group">
        <label for="messages-sent">Mensajes enviados por WhatsApp *</label>
        <input type="number" id="messages-sent" min="0" placeholder="Ej: 25" required>
      </div>

      <div class="form-group">
        <label for="chat-status">Estado del chat *</label>
        <select id="chat-status" required>
          <option value="">-- Seleccioná un estado --</option>
          <option value="En proceso">En proceso</option>
          <option value="Cerrado (venta exitosa)">Cerrado (venta exitosa)</option>
          <option value="Venta caída">Venta caída</option>
        </select>
      </div>

      <!-- Motivo venta caída -->
      <div class="form-group" id="fall-reason-group" style="display:none">
        <label for="fall-reason">Motivo de venta caída *</label>
        <select id="fall-reason">
          <option value="">-- Seleccioná un motivo --</option>
          <option value="Precio muy alto">Precio muy alto</option>
          <option value="No le interesó el producto">No le interesó el producto</option>
          <option value="Sin respuesta del cliente">Sin respuesta del cliente</option>
          <option value="Se lo llevó la competencia">Se lo llevó la competencia</option>
          <option value="Otro">Otro</option>
        </select>
      </div>

      <div class="form-group" id="fall-other-group" style="display:none">
        <label for="fall-other">Especificá el motivo *</label>
        <input type="text" id="fall-other" placeholder="Describí el motivo...">
      </div>

      <!-- Productos -->
      <div class="form-group">
        <label>Productos consultados</label>
        <div class="product-checkboxes" id="product-list">
          <span style="color:var(--gray-600);font-size:13px;grid-column:1/-1">Cargando productos...</span>
        </div>
        <p class="help-text">Podés seleccionar uno o más productos.</p>
      </div>

      <!-- Ticket -->
      <div class="form-group">
        <label for="ticket-amount">Ticket solicitado ($)</label>
        <input type="number" id="ticket-amount" min="0" step="0.01" placeholder="Ej: 15000">
      </div>

      <!-- Observaciones -->
      <div class="form-group">
        <label for="observations">Observaciones</label>
        <textarea id="observations" placeholder="Notas adicionales sobre este registro..."></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="submit-btn">
        Guardar registro
      </button>

    </form>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
